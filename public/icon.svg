<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b0f19" />
      <stop offset="50%" stop-color="#111827" />
      <stop offset="100%" stop-color="#050811" />
    </linearGradient>
    <linearGradient id="neonGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06b6d4" />
      <stop offset="50%" stop-color="#6366f1" />
      <stop offset="100%" stop-color="#ec4899" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background with rounded squircles -->
  <rect width="512" height="512" rx="128" fill="url(#bgGrad)" />

  <!-- Outer Vinyl Glow Ring -->
  <circle cx="256" cy="256" r="180" fill="none" stroke="url(#neonGrad)" stroke-width="8" opacity="0.4" filter="url(#glow)" />
  <circle cx="256" cy="256" r="170" fill="#0f172a" stroke="url(#neonGrad)" stroke-width="4" />

  <!-- Vinyl Grooves -->
  <circle cx="256" cy="256" r="140" fill="none" stroke="#334155" stroke-width="2" stroke-dasharray="8 6" opacity="0.6" />
  <circle cx="256" cy="256" r="110" fill="none" stroke="#334155" stroke-width="2" stroke-dasharray="6 4" opacity="0.6" />

  <!-- Center Vinyl Label -->
  <circle cx="256" cy="256" r="75" fill="url(#neonGrad)" />
  <circle cx="256" cy="256" r="24" fill="#0f172a" />

  <!-- Soundwave Bars at Center -->
  <rect x="236" y="240" width="8" height="32" rx="4" fill="#ffffff" />
  <rect x="252" y="228" width="8" height="56" rx="4" fill="#ffffff" />
  <rect x="268" y="244" width="8" height="24" rx="4" fill="#ffffff" />

  <!-- Neon Accent Sparkle -->
  <circle cx="390" cy="120" r="12" fill="#ec4899" filter="url(#glow)" />
  <circle cx="120" cy="380" r="8" fill="#06b6d4" filter="url(#glow)" />
</svg>
